{% extends 'base.html' %}
{% block content %}
<div class="mb-5">
  <h2 class="display-6 fw-bold mb-3">Поставить оценку</h2>
  <p class="text-muted">Выберите ученика, предмет и оценку</p>
</div>

<div class="card mb-5">
  <div class="card-body">
    <form method="post" class="row g-4" id="grade-form">
      {% csrf_token %}
      
      <div class="col-12 mb-4">
        <label for="student-select" class="form-label">Ученик</label>
        <select name="student" class="form-control" id="student-select" required>
          <option value="" disabled selected>Выберите ученика</option>
          {% for s in students %}
            <option value="{{ s.id }}" title="{{ s.full_name }} ({{ s.school_class }})">{{ s.full_name }} ({{ s.school_class }})</option>
          {% endfor %}
        </select>
      </div>
      
      <div class="col-md-6 mb-4">
        <label for="subject-select" class="form-label">Предмет</label>
        <select name="subject" class="form-control" id="subject-select" required>
          <option value="" disabled selected>Выберите предмет</option>
          {% for sub in subjects %}
            <option value="{{ sub.id }}" title="{{ sub.name }}">{{ sub.name }}</option>
          {% endfor %}
        </select>
      </div>
      
      <div class="col-md-6 mb-4">
        <label for="grade-select" class="form-label">Оценка</label>
        <select name="value" class="form-control" id="grade-select" required>
          <option value="" disabled selected>Выберите оценку</option>
          <option value="5" title="5 (Отлично)">5 (Отлично)</option>
          <option value="4" title="4 (Хорошо)">4 (Хорошо)</option>
          <option value="3" title="3 (Удовлетворительно)">3 (Удовлетворительно)</option>
          <option value="2" title="2 (Неудовлетворительно)">2 (Неудовлетворительно)</option>
        </select>
      </div>
      
      <div class="col-12 mb-4">
        <label for="comment-textarea" class="form-label">Комментарий</label>
        <textarea name="comment" class="form-control" id="comment-textarea" rows="3" placeholder="Введите комментарий (необязательно)"></textarea>
      </div>
      
      <div class="col-12 mt-2">
        <div class="d-flex flex-column flex-md-row gap-3">
          <button type="submit" class="btn btn-primary flex-fill hover-grow py-3">
            <i class="fas fa-check me-2"></i>Поставить оценку
          </button>
          <a href="{% url 'my_grades' %}" class="btn btn-outline flex-fill py-3">
            <i class="fas fa-arrow-left me-2"></i>Назад
          </a>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const gradeSelect = document.getElementById('grade-select');
    const commentTextarea = document.getElementById('comment-textarea');
    
    // Функция для управления обязательностью комментария
    function toggleCommentRequired() {
      const value = parseInt(gradeSelect.value);
      if (value < 5) {
        commentTextarea.setAttribute('required', 'required');
        commentTextarea.placeholder = 'Введите комментарий (обязательно при оценке ниже 5)';
      } else {
        commentTextarea.removeAttribute('required');
        commentTextarea.placeholder = 'Введите комментарий (необязательно)';
      }
    }
    
    // Установка начального состояния
    toggleCommentRequired();
    
    // Отслеживание изменений в выборе оценки
    gradeSelect.addEventListener('change', toggleCommentRequired);
  });
</script>
{% endblock %}
